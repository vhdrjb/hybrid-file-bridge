name: Tests and Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enable multiverse and install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rar aria2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort flake8

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Check formatting with black
        run: python -m black --check tools/ bot.py tests/

      - name: Check imports with isort
        run: python -m isort --check-only tools/ bot.py tests/

      - name: Lint with flake8
        run: python -m flake8 tools/ bot.py tests/ --max-line-length=100 --ignore=E501,W503,E203
